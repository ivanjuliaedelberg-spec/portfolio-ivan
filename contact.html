<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Iván Juliá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ─── NAVBAR ─── -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">IVAN JULIA<span class="nav-tagline">Cinematographer</span></a>
    <ul class="nav-links">
      <li><a href="index.html#music-videos" class="nav-item" data-filter="music-videos">Music Videos</a></li>
      <li><a href="index.html#commercials" class="nav-item" data-filter="commercials">Commercials</a></li>
      <li><a href="index.html#narrative" class="nav-item" data-filter="narrative">Narrative</a></li>
      <li><a href="contact.html" class="nav-item active">Contact</a></li>
    </ul>
    <button class="nav-burger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ─── CONTACT ─── -->
  <section class="contact-section">

    <!-- Top: bio (left) + photo (right) -->
    <div class="contact-top">

      <div class="contact-bio" id="bio-container">
      </div>

      <div class="contact-photo">
        <img src="assets/images/profile.JPG" alt="Iván Juliá" />
      </div>

    </div>

    <!-- Bottom: contact details -->
    <div class="contact-bottom" id="contact-groups">
    </div>

  </section>

  <script src="js/main.js"></script>
  <script>
    fetch('/data/bio.json')
      .then(r => r.json())
      .then(paragraphs => {
        const container = document.getElementById('bio-container');
        paragraphs.forEach(text => {
          const p = document.createElement('p');
          p.textContent = text;
          container.appendChild(p);
        });
      });

    fetch('/data/contact.json')
      .then(r => r.json())
      .then(groups => {
        const container = document.getElementById('contact-groups');
        groups.forEach(group => {
          const isExternal = href => href && href.startsWith('http');
          const items = group.items.map(item => {
            if (!item.href) {
              return `<span class="contact-link">${item.text}</span>`;
            }
            const ext = isExternal(item.href) ? ' target="_blank" rel="noopener"' : '';
            return `<a href="${item.href}" class="contact-link"${ext}>${item.text}</a>`;
          }).join('');
          const div = document.createElement('div');
          div.className = 'contact-group';
          div.innerHTML = `
            <span class="contact-group-label">${group.label}</span>
            <div class="contact-info-row">${items}</div>`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
