<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Iván Juliá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ─── NAVBAR ─── -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">IVAN JULIA<span class="nav-tagline">Cinematographer</span></a>
    <ul class="nav-links">
      <li><a href="index.html#music-videos" class="nav-item" data-filter="music-videos">Music Videos</a></li>
      <li><a href="index.html#commercials" class="nav-item" data-filter="commercials">Commercials</a></li>
      <li><a href="index.html#narrative" class="nav-item" data-filter="narrative">Narrative</a></li>
      <li><a href="contact.html" class="nav-item active">Contact</a></li>
    </ul>
    <button class="nav-burger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ─── CONTACT ─── -->
  <section class="contact-section">

    <!-- Top: bio (left) + photo (right) -->
    <div class="contact-top">

      <div class="contact-bio" id="bio-container">
      </div>

      <div class="contact-photo">
        <img src="assets/images/profile.JPG" alt="Iván Juliá" />
      </div>

    </div>

    <!-- Bottom: contact details -->
    <div class="contact-bottom">

      <div class="contact-group">
        <span class="contact-group-label">Direct</span>
        <div class="contact-info-row">
          <a href="mailto:ivanjulia.edelberg@gmail.com" class="contact-link">ivanjulia.edelberg@gmail.com</a>
          <a href="tel:+541151496388" class="contact-link">+54 11 5149-6388</a>
        </div>
      </div>

      <div class="contact-group">
        <span class="contact-group-label">Agent — EU</span>
        <div class="contact-info-row">
          <span class="contact-link">Orbita</span>
          <a href="tel:+34644069260" class="contact-link">+34 644 06 92 60</a>
        </div>
      </div>

      <div class="contact-group">
        <span class="contact-group-label">Social</span>
        <div class="contact-info-row">
          <a href="https://www.instagram.com/ivanjulia_/" target="_blank" rel="noopener" class="contact-link">Instagram</a>
          <a href="https://vimeo.com/ivanjulia" target="_blank" rel="noopener" class="contact-link">Vimeo</a>
        </div>
      </div>

    </div>

  </section>

  <script src="js/main.js"></script>
  <script>
    fetch('/data/bio.json')
      .then(r => r.json())
      .then(paragraphs => {
        const container = document.getElementById('bio-container');
        paragraphs.forEach(text => {
          const p = document.createElement('p');
          p.textContent = text;
          container.appendChild(p);
        });
      });
  </script>
</body>
</html>
